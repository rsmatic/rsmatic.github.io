name = "aby41-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Isang address lang: ang workers.dev route. Walang per-version preview URL,
# para iisa lang ang pampublikong pintuan ng API.
workers_dev = true
preview_urls = false

# Sino ang pwedeng tumawag sa API na ito mula sa browser.
# Idagdag dito ang kahit anong bagong domain na gagamitin mo.
[vars]
ALLOWED_ORIGINS = "https://rsmatic.github.io,http://localhost:3000,http://127.0.0.1:3000"

# Galing sa:  npx wrangler d1 create aby41
[[d1_databases]]
binding = "DB"
database_name = "aby41"
database_id = "d6801e57-3219-42e8-ab4a-b0199588f618"

# Ang ADMIN_KEY ay secret, hindi nakalagay dito:
#   npx wrangler secret put ADMIN_KEY --config worker/wrangler.toml
